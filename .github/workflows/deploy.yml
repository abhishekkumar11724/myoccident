# Deploys to GitHub Pages when you push to main. NOT triggered until you push - nothing here runs automatically today.
name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Photo variants (60 photos x 19 styles) take a while to render; reuse them while photos/recipes/fx are unchanged.
      - uses: actions/cache@v4
        with:
          path: |
            public/generated
            src/generated/manifest
          key: images-${{ hashFiles('photos/**', 'src/themes/*/recipe.mjs', 'scripts/fx/index.mjs', 'scripts/build-images.mjs', 'src/content/photos.ts') }}
          restore-keys: images-
      - run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
